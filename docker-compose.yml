# Yuque DL Web Console — docker compose template (LAN)
#
# Usage:
#   docker compose up -d --build
#   open http://localhost:8787/
#
# Optional: set secrets in .env next to this file.

services:
  yuque-dl-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: yuque-dl-web:local
    container_name: yuque-dl-web
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 8787
      # Persist console data (jobs/settings/schedules/downloads)
      YUQUE_DL_DATA: /data
      # Optional console access password (leave empty for open LAN use)
      YUQUE_DL_ACCESS_PASSWORD: ${YUQUE_DL_ACCESS_PASSWORD:-}
      # Encryption / session secret (recommended in production)
      YUQUE_DL_SECRET: ${YUQUE_DL_SECRET:-}
      # Set to 1 only when reverse-proxy terminates HTTPS
      YUQUE_DL_COOKIE_SECURE: ${YUQUE_DL_COOKIE_SECURE:-0}
      # Set to 1 only behind a trusted reverse proxy
      YUQUE_DL_TRUST_PROXY: ${YUQUE_DL_TRUST_PROXY:-0}
      # Set to 1 to refuse starting when another process holds instance.lock
      YUQUE_DL_STRICT_SINGLE_INSTANCE: ${YUQUE_DL_STRICT_SINGLE_INSTANCE:-0}
    volumes:
      - yuque-dl-data:/data
    # single instance: do not scale this service with shared volume

volumes:
  yuque-dl-data:
